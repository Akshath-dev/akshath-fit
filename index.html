<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plan | 1900 kcal · 150g Protein · Recomposition</title>
<meta name="description" content="Comprehensive Indian high-protein meal plan for fat loss and muscle gain. 1900 kcal, 150g protein, tailored for working professionals.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="meal-plan.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>🍽️ Weekly Meal Plan</h1>
    <p>Indian High-Protein Recomposition Diet · 179cm · 75kg · Age 24</p>
    <div class="badges">
      <span class="badge cal">🔥 ~1900 kcal</span>
      <span class="badge pro">💪 150g Protein</span>
      <span class="badge carb">⚡ ~190g Carbs</span>
      <span class="badge fat">🫒 ~55g Fat</span>
    </div>
  </header>

  <nav class="nav" id="nav"></nav>
  <main id="content"></main>

  <footer class="foot">
    Height: 179cm · Weight: 75kg · Age: 24 · Goal: Fat Loss + Muscle Gain<br>
    Weight Training Mon–Fri · Cardio/Conditioning Weekends · Review plan every 4 weeks
  </footer>
</div>

<script src="meal-plan-data.js"></script>
<script>
// --- Training Tracker State (localStorage) ---
const STORAGE_KEY = 'akshath-training-checks';
let trainChecks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let activeTrainDay = 1;

function saveChecks() { localStorage.setItem(STORAGE_KEY, JSON.stringify(trainChecks)); }

function toggleExercise(dayId, idx) {
  const key = `${dayId}-${idx}`;
  trainChecks[key] = !trainChecks[key];
  saveChecks();
  renderTrainingDay(dayId);
}

function resetDay(dayId) {
  const day = TRAINING_DAYS.find(d => d.id === dayId);
  day.exercises.forEach((_, i) => { delete trainChecks[`${dayId}-${i}`]; });
  saveChecks();
  renderTrainingDay(dayId);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function renderTrainingDay(dayId) {
  activeTrainDay = dayId;
  const day = TRAINING_DAYS.find(d => d.id === dayId);
  const rgb = hexToRgb(day.color);
  const done = day.exercises.filter((_,i) => trainChecks[`${dayId}-${i}`]).length;
  const pct = Math.round((done / day.exercises.length) * 100);
  const maxSets = Math.max(...day.exercises.map(e => e.sets || 0));

  let html = `<div class="train-days">`;
  TRAINING_DAYS.forEach(d => {
    const dRgb = hexToRgb(d.color);
    const act = d.id === dayId ? ' active' : '';
    html += `<button class="train-day-btn${act}" style="--day-color:${d.color};--day-color-rgb:${dRgb}" onclick="renderTrainingDay(${d.id})">
      <div class="tdb-icon">${d.icon}</div><div>${d.label}</div></button>`;
  });
  html += `</div>`;

  // Header card
  html += `<div class="train-header" style="background:linear-gradient(135deg,#111118 0%,rgba(${rgb},.06) 100%);border-color:rgba(${rgb},.25)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="train-tag" style="background:rgba(${rgb},.15);color:${day.color};border:1px solid rgba(${rgb},.3)">${day.tag}</div>
        <div class="train-title">${day.title.toUpperCase()}</div>
      </div>
      <div style="font-size:2rem">${day.icon}</div>
    </div>
    <div class="train-progress">
      <div class="train-bar-bg"><div class="train-bar-fill" style="width:${pct}%;background:${day.color}"></div></div>
      <div class="train-pct" style="color:${day.color}">${done}/${day.exercises.length}</div>
    </div>
  </div>`;

  // Stats
  if (day.exercises[0].sets) {
    html += `<div class="train-stats">
      <div class="train-stat"><div class="train-stat-val" style="color:${day.color}">${day.exercises.length}</div><div class="train-stat-lbl">EXERCISES</div></div>
      <div class="train-stat"><div class="train-stat-val" style="color:${day.color}">${maxSets}</div><div class="train-stat-lbl">MAX SETS</div></div>
      <div class="train-stat"><div class="train-stat-val" style="color:${day.color}">${day.tag}</div><div class="train-stat-lbl">FOCUS</div></div>
    </div>`;
  }

  // Exercises
  day.exercises.forEach((ex, i) => {
    const key = `${dayId}-${i}`;
    const isDone = !!trainChecks[key];
    html += `<div class="ex-row${isDone ? ' done' : ''}" style="--day-color:${day.color};--day-color-rgb:${rgb}" onclick="toggleExercise(${dayId},${i})">
      <div class="ex-check${isDone ? ' checked' : ''}">${isDone ? '✓' : ''}</div>
      <div style="flex:1">
        <div class="ex-name">${ex.name}</div>`;
    if (ex.sets) {
      html += `<div class="ex-tags">
        <span class="ex-tag">${ex.sets} sets</span>`;
      if (ex.reps && ex.reps !== '1') html += `<span class="ex-tag">${ex.reps} reps</span>`;
      html += `<span class="ex-tag ex-tag-load" style="--day-color:${day.color};color:${day.color};background:rgba(${rgb},.1)">${ex.load}</span></div>`;
    }
    if (ex.note) html += `<div class="ex-note">${ex.note}</div>`;
    html += `</div></div>`;
  });

  // Coach note
  html += `<div class="coach-note">
    <div class="coach-note-label">COACH NOTE</div>
    <div class="coach-note-text">${COACH_NOTES[dayId]}</div>
  </div>`;

  // Reset button
  if (done > 0) {
    html += `<button class="reset-btn" onclick="event.stopPropagation();resetDay(${dayId})">↺ Reset Day ${dayId}</button>`;
  }

  document.getElementById('training-container').innerHTML = html;
}

function renderTraining() {
  return `<div class="sec-title">🏋️ Mesocycle 1 — Weeks 1–6</div>
    <div class="sec-sub">S&C Training Plan · Click exercises to mark complete · Progress saved locally</div>
    <div id="training-container"></div>`;
}

// --- Tab System ---
const TABS = [
  { id: 'training', label: '🏋️ Training' },
  ...DAYS.map(d => ({ id: d.id, label: d.title.split('—')[0].trim() })),
  { id: 'workout', label: '💪 Workout Nutrition' },
  { id: 'grocery', label: '🛒 Grocery' },
  { id: 'prep', label: '📦 Meal Prep' },
  { id: 'extras', label: '📋 Extras' }
];

function renderMeal(m) {
  return `<div class="meal">
    <div class="meal-top"><span class="meal-name">${m.name}</span><span class="meal-time">${m.time}</span></div>
    <div class="macros">
      <span class="m m-cal">${m.kcal} kcal</span>
      <span class="m m-pro">${m.p}g P</span>
      <span class="m m-carb">${m.c}g C</span>
      <span class="m m-fat">${m.f}g F</span>
    </div>
    <ul class="items">${m.items.map(i => `<li>${i}</li>`).join('')}</ul>
  </div>`;
}

function renderDay(d) {
  return `<div class="sec-title">${d.title}</div>
    <div class="sec-sub">${d.subtitle}</div>
    <div class="meals">${d.meals.map(renderMeal).join('')}</div>
    <div class="totals">
      <div class="tot"><div class="tot-v" style="color:var(--orange)">${d.totals.kcal}</div><div class="tot-l">kcal</div></div>
      <div class="tot"><div class="tot-v" style="color:var(--green)">${d.totals.p}g</div><div class="tot-l">Protein</div></div>
      <div class="tot"><div class="tot-v" style="color:var(--blue)">${d.totals.c}g</div><div class="tot-l">Carbs</div></div>
      <div class="tot"><div class="tot-v" style="color:var(--red)">${d.totals.f}g</div><div class="tot-l">Fat</div></div>
    </div>`;
}

function renderInfoBox(box, cls = '') {
  return `<div class="info-box ${cls}"><h3>${box.title}</h3>
    <ul>${box.items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
}

function renderWorkout() {
  return `<div class="sec-title">Workout Nutrition & Recovery</div>
    <div class="sec-sub">Optimized for evening gym sessions after office</div>
    <div class="grid2">${WORKOUT_NUTRITION.map(w => renderInfoBox(w)).join('')}</div>`;
}

function renderGrocery() {
  let html = `<div class="sec-title">Weekly Grocery List</div>
    <div class="sec-sub">Budget-friendly. Estimated weekly cost: ₹1,800–2,200</div>`;
  GROCERY.forEach(g => {
    html += `<div class="info-box"><h3>${g.cat}</h3>
      <table class="tbl"><tr><th>Item</th><th>Quantity</th><th>Cost</th></tr>
      ${g.items.map(i => `<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.cost}</td></tr>`).join('')}
      </table></div>`;
  });
  return html;
}

function renderPrep() {
  return `<div class="sec-title">Meal Prep Strategy</div>
    <div class="sec-sub">Spend 2 hours Sunday + 30 min Wednesday = stress-free weekdays</div>
    ${MEAL_PREP.map(p => renderInfoBox(p)).join('')}`;
}

function renderExtras() {
  let html = `<div class="sec-title">Additional Guidance</div><div class="sec-sub">Supplements, substitutions, and foods to avoid</div>`;
  html += `<div class="info-box"><h3>💊 Supplement Recommendations</h3>
    <table class="tbl"><tr><th>Supplement</th><th>Dose</th><th>Why</th><th>Priority</th></tr>
    ${SUPPLEMENTS.map(s => `<tr><td>${s.name}</td><td>${s.dose}</td><td>${s.why}</td><td class="hi">${s.priority}</td></tr>`).join('')}
    </table></div>`;
  html += `<div class="info-box"><h3>🔄 Food Substitutions</h3>
    <table class="tbl"><tr><th>Original</th><th>Alternatives</th></tr>
    ${SUBSTITUTIONS.map(s => `<tr><td>${s.original}</td><td>${s.alts}</td></tr>`).join('')}
    </table></div>`;
  html += `<div class="grid2">`;
  html += renderInfoBox({ title: '🚫 Foods to Avoid During Recomp', items: AVOID_FOODS }, 'warn');
  html += renderInfoBox({ title: '🍕 Cheat Meal Guidelines', items: CHEAT_MEAL });
  html += `</div>`;
  return html;
}

const RENDERERS = { training: renderTraining };
DAYS.forEach(d => RENDERERS[d.id] = () => renderDay(d));
RENDERERS.workout = renderWorkout;
RENDERERS.grocery = renderGrocery;
RENDERERS.prep = renderPrep;
RENDERERS.extras = renderExtras;

function showTab(id) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.getElementById('content').innerHTML = `<div class="section active">${RENDERERS[id]()}</div>`;
  if (id === 'training') renderTrainingDay(activeTrainDay);
}

// Init
const nav = document.getElementById('nav');
TABS.forEach((t, i) => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
  btn.dataset.id = t.id;
  btn.textContent = t.label;
  btn.onclick = () => showTab(t.id);
  nav.appendChild(btn);
});
showTab(TABS[0].id);
</script>
</body>
</html>
